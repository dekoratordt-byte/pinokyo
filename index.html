<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sonsuz Döngülü Kağıt Tiyatrosu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Special+Elite&display=swap');
        
        :root { --curtain-color: #800000; }

        body {
            background-color: #f0f0f0;
            color: #1a1a1a;
            font-family: 'Playfair Display', serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url("resimler/arka.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* YÜKLEME EKRANI STİLLERİ */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            background-image: url("resimler/arka.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader-spin {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .theatre-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .theatre-box {
            position: relative;
            width: 100vh; 
            height: 100vh;
            background: #fff;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            overflow: hidden;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .theatre-box::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('resimler/cerceve.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 60;
        }

        .stage {
            position: absolute;
            top: 21%; 
            left: 10%;
            width: 80%;
            height: 52%;
            display: flex;
            overflow: hidden;
            z-index: 20;
        }

        .scroll-content {
            display: flex;
            will-change: transform;
            align-items: center;
          }

        .crankie-image {
            height: 100%;
            width: auto;
            object-fit: cover;
            display: block;
        }

        .main-curtain {
            position: absolute;
            top: 20%;
            width: 40.5%;
            height: 60%;
            background-color: var(--curtain-color);
            background-image: url("resimler/perde1.jpg");
            background-size: cover;
            z-index: 55;
            transition: transform 0.1s linear;
        }

        .curtain-left { left: 10%; transform-origin: left; }
        .curtain-right { right: 10%; transform-origin: right; }

        .controls-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 30px;
            z-index: 100;
        }

        .crank-label {
            font-family: 'Special Elite', cursive;
            font-size: 18px;
            font-weight: 900;
            color: white;
            text-shadow: 
                -2px -2px 0 #000, 
                 2px -2px 0 #000,
                -2px  2px 0 #000, 
                 2px  2px 0 #000,
                 0px  2px 0 #000, 
                 0px -2px 0 #000,
                 2px  0px 0 #000,
                -2px  0px 0 #000;
            margin-bottom: 10px;
            text-align: center;
            pointer-events: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .crank-wrapper {
            width: 120px;
            height: 120px;
        }

        .crank-handle {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none;
            position: relative;
            box-shadow: 4px 5px 0px rgba(0,0,0,0.1);
        }

        .crank-knob {
            width: 25px;
            height: 25px;
            background: #fff;
            border: 2px solid #1a1a1a;
            border-radius: 50%;
            position: absolute;
            top: 10px;
        }

        .music-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .music-btn {
            background: white;
            border: 2px solid #1a1a1a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 2px 3px 0px rgba(0,0,0,0.1);
        }

        .instruction {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.6;
            font-style: italic;
            pointer-events: none;
            z-index: 1000;
        }

        @media (orientation: portrait) {
            .theatre-container { flex-direction: column; }
            .theatre-box { width: 90vw; height: 90vw; }
            .controls-group { margin-left: 0; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="crank-label">YÜKLENİYOR...</div>
        <div class="crank-wrapper loader-spin">
            <div class="crank-handle">
                <div class="crank-knob"></div>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                    <polyline points="21 3 21 8 16 8"></polyline>
                </svg>
            </div>
        </div>
    </div>
    <audio id="bgMusic" src="resimler/fon.mp3" loop preload="auto"></audio>
    <div class="theatre-container">
        <div class="theatre-box" id="theatreBox">
            <div id="curtainLeft" class="main-curtain curtain-left"></div>
            <div id="curtainRight" class="main-curtain curtain-right"></div>
            <div class="stage">
                <div id="scrollContent" class="scroll-content"></div>
            </div>
        </div>
        <div class="controls-group">
            <div class="crank-label">BENİ ÇEVİR</div>
            <div class="crank-wrapper">
                <div id="crankHandle" class="crank-handle">
                    <div class="crank-knob"></div>
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                        <polyline points="21 3 21 8 16 8"></polyline>
                    </svg>
                </div>
            </div>
            <div class="music-controls">
                <button id="playBtn" class="music-btn" title="Oynat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5,3 19,12 5,21"></polygon>
                    </svg>
                </button>
                <button id="stopBtn" class="music-btn" title="Durdur">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12"></rect>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div class="instruction" id="statusText">Çevirmeye başla...</div>

    <script>
        const IMAGE_PATH = "resimler/"; 
        const MY_IMAGES = ["sahne1.jpg","sahne2.jpg", "sahne3.jpg", "sahne4.jpg", "sahne5.jpg", "sahne6.jpg", "sahne7.jpg", "sahne8.jpg", "sahne9.jpg", "sahne10.jpg", "sahne12.jpg","sahne13.jpg","sahne14.jpg","sahne15.jpg","sahne16.jpg","sahne17.jpg","sahne18.jpg","sahne19.jpg","sahne20.jpg","sahne21.jpg","sahne22.jpg","sahne23.jpg","sahne24.jpg","sahne25.jpg","sahne26.jpg","sahne27.jpg","sahne28.jpg","sahne29.jpg","sahne30.jpg","sahne31.jpg","sahne32.jpg","sahne33.jpg","sahne34.jpg","sahne35.jpg","sahne36.jpg"];

        const scrollContent = document.getElementById('scrollContent');
        const crankHandle = document.getElementById('crankHandle');
        const curtainLeft = document.getElementById('curtainLeft');
        const curtainRight = document.getElementById('curtainRight');
        const statusText = document.getElementById('statusText');
        const bgMusic = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        const loopImages = [...MY_IMAGES, ...MY_IMAGES]; 
        loopImages.forEach((src) => {
            const img = document.createElement('img');
            img.src = IMAGE_PATH + src;
            img.className = 'crankie-image';
            scrollContent.appendChild(img);
        });

        let currentRotation = 0; 
        let lastAngle = 0;
        let isDragging = false;
        const sensitivity = 5; 
        const CURTAIN_OPEN_THRESHOLD = 360; 
        let musicStartedOnce = false; 

        // Yükleme Ekranı Kontrolü
        window.addEventListener('load', () => {
            const loader = document.getElementById('loadingScreen');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        });

        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        function handleFullscreenLogic() {
            if (!isMobileDevice()) return; 

            const isLandscape = window.innerWidth > window.innerHeight;
            const docEl = document.documentElement;

            if (isLandscape) {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (docEl.requestFullscreen) docEl.requestFullscreen();
                    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                }
            } else {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }
        }

        playBtn.addEventListener('click', () => {
            handleFullscreenLogic();
            bgMusic.play();
            musicStartedOnce = true; 
        });

        stopBtn.addEventListener('click', () => {
            bgMusic.pause();
            musicStartedOnce = true; 
        });

        function getAngle(x, y) {
            const rect = crankHandle.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * (180 / Math.PI);
        }

        function updateStage() {
            if (currentRotation <= CURTAIN_OPEN_THRESHOLD) {
                const progress = Math.max(0, currentRotation / CURTAIN_OPEN_THRESHOLD);
                curtainLeft.style.transform = `translateX(${-progress * 100}%)`;
                curtainRight.style.transform = `translateX(${progress * 100}%)`;
                statusText.innerText = " ";
            } else {
                curtainLeft.style.transform = `translateX(-105%)`;
                curtainRight.style.transform = `translateX(105%)`;
                const totalSetSize = scrollContent.scrollWidth / 2;
                let scrollPos = ((currentRotation - CURTAIN_OPEN_THRESHOLD) * sensitivity);
                const loopedScroll = scrollPos % totalSetSize;
                scrollContent.style.transform = `translateX(${-loopedScroll}px)`;
                statusText.innerText = "";
            }
        }

        function handleMove(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const newAngle = getAngle(clientX, clientY);
            let delta = newAngle - lastAngle;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            currentRotation += delta;
            if (currentRotation < 0) currentRotation = 0;
            lastAngle = newAngle;
            crankHandle.style.transform = `rotate(${currentRotation}deg)`;
            updateStage();
        }

        const start = (e) => {
            handleFullscreenLogic(); 
            if (!musicStartedOnce) {
                bgMusic.play().catch(e => console.log("Etkileşim bekleniyor..."));
                musicStartedOnce = true; 
            }
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastAngle = getAngle(clientX, clientY);
        };

        const stop = () => { isDragging = false; };

        crankHandle.addEventListener('mousedown', start);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', stop);
        crankHandle.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { handleMove(e); }, { passive: false });
        window.addEventListener('touchend', stop);

        window.addEventListener('resize', () => {
            if (isMobileDevice()) handleFullscreenLogic();
        });

        window.onload = updateStage;
    </script>
</body>
</html>
